name: Deploy (dev)

# Two machines:
#   • RUNNER (self-hosted "builder")  — checks out, builds both apps. Holds the
#     frontend build-time .env (NEXT_PUBLIC_* are baked in here, at build time).
#   • DEV SERVER (separate host)      — runs the backend jar + Next.js server behind
#     nginx. Holds the backend's external application.yaml. Reached over SSH.
#
# The runner pushes artifacts to the dev server with rsync-over-SSH and restarts the
# services there via the control scripts. See deploy/README.md for one-time setup.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  # Path on the RUNNER machine holding the frontend build-time env (not in the repo).
  FE_ENV_FILE: /opt/pangreksa-crm/config/frontend.env
  # Target paths on the DEV SERVER.
  BE_DIR: /opt/pangreksa-crm/backend
  FE_DIR: /opt/pangreksa-crm/frontend
  BIN_DIR: /opt/pangreksa-crm/bin
  BE_CONFIG: /opt/pangreksa-crm/config/application.yaml
  # SSH target — runner already has passwordless access; no key setup needed.
  SSH_TARGET: ${{ vars.DEV_SSH_USER }}@${{ vars.DEV_SSH_HOST }}
  SSH_PORT: ${{ vars.DEV_SSH_PORT || '22' }}
  SSH_OPTS: -o StrictHostKeyChecking=no -o BatchMode=yes

jobs:
  deploy:
    environment: dev
    runs-on: [self-hosted, Linux]   # the build runner (separate from the dev server)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Build backend (jar) ──
      - name: Build backend
        working-directory: pangreksa-crm-be
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -DskipTests clean package

      # ── Build frontend (NEXT_PUBLIC_* baked from the runner's env file) ──
      - name: Build frontend
        working-directory: pangreksa-crm-fe
        run: |
          cp "$FE_ENV_FILE" .env.production
          npm ci
          npm run build

      # ── Deploy backend: ship jar, restart via pre-installed script ──
      - name: Deploy backend
        run: |
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_TARGET" "mkdir -p '$BE_DIR/logs'"
          rsync -az -e "ssh $SSH_OPTS -p $SSH_PORT" pangreksa-crm-be/target/crm-be-*.jar "$SSH_TARGET:$BE_DIR/app.jar"
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_TARGET" "PANGREKSA_BE_DIR='$BE_DIR' PANGREKSA_BE_CONFIG='$BE_CONFIG' '$BIN_DIR/pangreksa-be.sh' restart"

      # ── Deploy frontend: ship build output, install runtime deps ON the dev server
      #    (so native binaries match its platform), then restart the Next server ──
      - name: Deploy frontend
        run: |
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_TARGET" "mkdir -p '$FE_DIR/.next' '$FE_DIR/public'"
          rsync -az --delete -e "ssh $SSH_OPTS -p $SSH_PORT" --exclude 'cache' pangreksa-crm-fe/.next/ "$SSH_TARGET:$FE_DIR/.next/"
          rsync -az -e "ssh $SSH_OPTS -p $SSH_PORT" pangreksa-crm-fe/package.json pangreksa-crm-fe/package-lock.json pangreksa-crm-fe/next.config.ts "$SSH_TARGET:$FE_DIR/"
          if [ -d pangreksa-crm-fe/public ]; then
            rsync -az --delete -e "ssh $SSH_OPTS -p $SSH_PORT" pangreksa-crm-fe/public/ "$SSH_TARGET:$FE_DIR/public/"
          fi
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_TARGET" "cd '$FE_DIR' && npm ci --omit=dev && PANGREKSA_FE_DIR='$FE_DIR' '$BIN_DIR/pangreksa-fe.sh' restart"

      - name: Health check (on dev server)
        run: |
          sleep 5
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_TARGET" "curl -s -o /dev/null -w 'frontend HTTP %{http_code}\n' http://127.0.0.1:3000/login; curl -s -o /dev/null -w 'backend  HTTP %{http_code}\n' -X POST -H 'Content-Type: application/json' -d '{\"username\":\"x\",\"password\":\"x\"}' http://127.0.0.1:8080/api/auth/login"
