spring:
  application:
    name: pangreksa-crm-be
  datasource:
    url: jdbc:postgresql://localhost:5432/pangreksa_crm
    username: pangreksa
    password: pangreksa
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080
  # Honor nginx's X-Forwarded-Proto/Host so Spring reconstructs the original https origin
  # behind the TLS-terminating reverse proxy. Without this, same-origin requests from an
  # https page look cross-origin (https Origin vs http request) and are rejected by CORS.
  forward-headers-strategy: framework

pangreksa:
  # Seed demo/sample CRM data (Manager/Rep roles, demo users, accounts/contacts/leads/deals)
  # on a fresh DB. The baseline (config, lookups, Admin role, admin user) is always seeded.
  seed: false
  # Filesystem root for attachment blobs (FilesystemBlobStore). Mount a volume here in Docker.
  storage:
    path: "./storage"
  cors:
    allowed-origins: "http://localhost:3000"
  jwt:
    secret: "pangreksa-crm-dev-secret-change-me-please-32bytes-minimum-0123456789"
    expiry-hours: 12

logging:
  level:
    org.hibernate.SQL: warn
