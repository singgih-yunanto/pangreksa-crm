        - addForeignKeyConstraint: { constraintName: fk_leads_conv_deal, baseTableName: leads, baseColumnNames: converted_deal_id, referencedTableName: deals, referencedColumnNames: id }

  # ---- Idempotent data changesets: new activity picklists + role permission grants. ----
  # These run on every environment; INSERT ... WHERE NOT EXISTS keeps them safe on already-seeded DBs.
  # On a fresh install they run before the seeder creates roles, so the seeder's Permissions.ALL /
  # MODULES grants cover new installs and these grants cover existing installs.
  - changeSet:
      id: 016-seed-activity-lookups
      author: pangreksa
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              INSERT INTO lookups (created_at, updated_at, category, code, label, sort_order, active, extra)
              SELECT now(), now(), v.category, v.code, v.code, v.ord, true, v.extra::jsonb
              FROM (VALUES
                ('task_status','Not Started',0,'{}'),
                ('task_status','In Progress',1,'{}'),
                ('task_status','Waiting for input',2,'{}'),
                ('task_status','Deferred',3,'{}'),
                ('task_status','Completed',4,'{"closed": true}'),
                ('task_priority','Highest',0,'{}'),
                ('task_priority','High',1,'{}'),
                ('task_priority','Normal',2,'{}'),
                ('task_priority','Low',3,'{}'),
                ('task_priority','Lowest',4,'{}'),
                ('meeting_status','Planned',0,'{}'),
                ('meeting_status','Held',1,'{"closed": true}'),
                ('meeting_status','Cancelled',2,'{"closed": true}'),
                ('call_type','Outbound',0,'{}'),
                ('call_type','Inbound',1,'{}'),
                ('call_type','Missed',2,'{}'),
                ('call_purpose','Prospecting',0,'{}'),
                ('call_purpose','Administrative',1,'{}'),
                ('call_purpose','Negotiation',2,'{}'),
                ('call_purpose','Demo',3,'{}'),
                ('call_purpose','Project',4,'{}'),
                ('call_purpose','Desk',5,'{}'),
                ('call_result','Interested',0,'{}'),
                ('call_result','Not interested',1,'{}'),
                ('call_result','No response',2,'{}'),
                ('call_result','Requested info',3,'{}'),
                ('call_result','Call back later',4,'{}')
              ) AS v(category, code, ord, extra)
              WHERE NOT EXISTS (
                SELECT 1 FROM lookups l WHERE l.category = v.category AND l.code = v.code
              );

  - changeSet:
      id: 017-grant-activity-permissions
      author: pangreksa
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              -- Admin & Sales Manager: full CRUD on the new activity modules.
              INSERT INTO role_permissions (role_id, permission)
              SELECT r.id, p.permission
              FROM roles r
              CROSS JOIN (VALUES
                ('TASK_VIEW'),('TASK_CREATE'),('TASK_EDIT'),('TASK_DELETE'),
                ('MEETING_VIEW'),('MEETING_CREATE'),('MEETING_EDIT'),('MEETING_DELETE'),
                ('CALL_VIEW'),('CALL_CREATE'),('CALL_EDIT'),('CALL_DELETE')
              ) AS p(permission)
              WHERE r.name IN ('Admin','Sales Manager')
                AND NOT EXISTS (
                  SELECT 1 FROM role_permissions rp WHERE rp.role_id = r.id AND rp.permission = p.permission
                );
              -- Sales Rep: view/create/edit only (no delete), matching the existing rep grant.
              INSERT INTO role_permissions (role_id, permission)
              SELECT r.id, p.permission
              FROM roles r
              CROSS JOIN (VALUES
                ('TASK_VIEW'),('TASK_CREATE'),('TASK_EDIT'),
                ('MEETING_VIEW'),('MEETING_CREATE'),('MEETING_EDIT'),
                ('CALL_VIEW'),('CALL_CREATE'),('CALL_EDIT')
              ) AS p(permission)
              WHERE r.name = 'Sales Rep'
                AND NOT EXISTS (
                  SELECT 1 FROM role_permissions rp WHERE rp.role_id = r.id AND rp.permission = p.permission
                );
