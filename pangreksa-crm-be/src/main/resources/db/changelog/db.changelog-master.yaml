              - column: { name: other_code, type: varchar(255) }
              - column: { name: email_opt_out, type: boolean, constraints: { nullable: false } }
              - column: { name: description, type: text }
        - addForeignKeyConstraint: { constraintName: fk_contacts_owner, baseTableName: contacts, baseColumnNames: owner_id, referencedTableName: users, referencedColumnNames: id }
        - addForeignKeyConstraint: { constraintName: fk_contacts_account, baseTableName: contacts, baseColumnNames: account_id, referencedTableName: accounts, referencedColumnNames: id }
        - addForeignKeyConstraint: { constraintName: fk_contacts_reporting_to, baseTableName: contacts, baseColumnNames: reporting_to_id, referencedTableName: contacts, referencedColumnNames: id }
        - addForeignKeyConstraint: { constraintName: fk_contacts_lead_source, baseTableName: contacts, baseColumnNames: lead_source_id, referencedTableName: lookups, referencedColumnNames: id }

