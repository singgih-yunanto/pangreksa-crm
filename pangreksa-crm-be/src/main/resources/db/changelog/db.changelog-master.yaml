              - column: { name: first_name, type: varchar(255) }
              - column: { name: last_name, type: varchar(255), constraints: { nullable: false } }
              - column: { name: account_id, type: bigint }
              - column: { name: title, type: varchar(255) }
              - column: { name: department, type: varchar(255) }
              - column: { name: email, type: varchar(255) }
              - column: { name: secondary_email, type: varchar(255) }
              - column: { name: phone, type: varchar(255) }
              - column: { name: mobile, type: varchar(255) }
              - column: { name: home_phone, type: varchar(255) }
              - column: { name: other_phone, type: varchar(255) }
              - column: { name: fax, type: varchar(255) }
              - column: { name: date_of_birth, type: date }
              - column: { name: assistant, type: varchar(255) }
              - column: { name: lead_source_id, type: bigint }
              - column: { name: reporting_to_id, type: bigint }
              - column: { name: mailing_street, type: varchar(255) }
              - column: { name: mailing_city, type: varchar(255) }
              - column: { name: mailing_state, type: varchar(255) }
