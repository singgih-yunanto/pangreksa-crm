databaseChangeLog:
  - changeSet:
      id: 001-create-configuration
      author: pangreksa
      changes:
        - createTable:
            tableName: configuration
            columns:
              - column: { name: id, type: bigint, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: created_at, type: timestamp, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, constraints: { nullable: false } }
              - column: { name: config_key, type: varchar(255), constraints: { nullable: false, unique: true } }
              - column: { name: config_value, type: varchar(1000) }
              - column: { name: label, type: varchar(255) }
              - column: { name: extra, type: jsonb }

