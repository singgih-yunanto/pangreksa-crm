              - column: { name: category, type: varchar(255), constraints: { nullable: false } }
              - column: { name: code, type: varchar(255), constraints: { nullable: false } }
              - column: { name: label, type: varchar(255), constraints: { nullable: false } }
              - column: { name: sort_order, type: int, constraints: { nullable: false } }
              - column: { name: active, type: boolean, constraints: { nullable: false } }
              - column: { name: extra, type: jsonb }
        - addUniqueConstraint: { tableName: lookups, columnNames: "category, code", constraintName: uq_lookup_cat_code }

